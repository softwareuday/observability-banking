global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

route:
  receiver: 'default'
  group_by: ['alertname', 'application', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: 'critical-team'
      continue: true
    - match:
        severity: warning
      receiver: 'default'

receivers:
  - name: 'default'
    slack_configs:
      - channel: '#banking-alerts'
        title: '⚠️ {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"

  - name: 'critical-team'
    slack_configs:
      - channel: '#banking-critical'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}\n{{ end }}"
    email_configs:
      - to: 'oncall@banking.example.com'
        from: 'alertmanager@banking.example.com'
        smarthost: 'smtp.gmail.com:587'
        auth_username: 'alerts@banking.example.com'
        auth_password: 'app-password'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'application']